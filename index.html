<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor de Imagen a PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background-color: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input[type="file"] { margin: 20px 0; }
    button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Convertir Imagen a PDF</h2>
    <input type="file" id="imageInput" accept="image/png, image/jpeg">
    <br>
    <button onclick="convertirAPDF()">Descargar PDF</button>
  </div>

  <script>
    async function convertirAPDF() {
      const input = document.getElementById('imageInput');
      if (input.files.length === 0) {
        alert('Por favor selecciona una imagen primero.');
        return;
      }

      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;

        img.onload = function() {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: img.width > img.height ? 'l' : 'p',
            unit: 'px',
            format: [img.width, img.height]
          });

          pdf.addImage(img, 'JPEG', 0, 0, img.width, img.height);
          pdf.save('imagen-convertida.pdf');
        };
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
